name: Nightly ALBdrinks Backup

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run remote backup over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            bash ./scripts/backup.sh
            bash ./scripts/prune_backups.sh "${{ secrets.BACKUP_KEEP_COUNT || '14' }}"
