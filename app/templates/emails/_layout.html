<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f1f5f9">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" style="max-width:{{ max_width|default(560) }}px;" cellpadding="0" cellspacing="0">

  <tr><td bgcolor="#0f172a" style="border-radius:12px 12px 0 0;padding:{{ header_padding|default('28px 32px') }};">
    <div style="color:#22d3ee;font-size:{{ brand_size|default(22) }}px;font-weight:700;letter-spacing:-0.5px;">ALBdrinks</div>
    <div style="color:#94a3b8;font-size:13px;margin-top:4px;">{{ subtitle }}</div>
  </td></tr>

  <tr><td bgcolor="#ffffff" style="padding:{{ body_padding|default('28px 32px') }};">
    {% block content %}{% endblock %}
  </td></tr>

  <tr><td style="background:#f8fafc;border-top:1px solid #e2e8f0;border-radius:0 0 12px 12px;padding:{{ footer_padding|default('18px 32px') }};">
    <p style="margin:0;font-size:12px;color:#94a3b8;">ALBdrinks &middot; Internal office drinks tracker</p>
  </td></tr>

</table>
</td></tr>
</table>
</body></html>
