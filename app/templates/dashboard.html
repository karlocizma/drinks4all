<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALBdrinks - Dashboard</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="topbar" style="justify-content:space-between;padding:0.6rem 1rem;">
    <div style="display:flex;align-items:center;gap:0.6rem;">
      <img src="/static/logo-wordmark.svg" alt="ALBdrinks" style="height:26px;">
      <span id="topbar-username" style="font-size:0.85rem;color:var(--fg2);font-weight:600;"></span>
      <span id="topbar-month" style="font-size:0.78rem;color:var(--fg-muted);"></span>
    </div>
    <div style="display:flex;align-items:center;gap:0.4rem;">
      <button id="undo-btn" class="btn btn-secondary" style="padding:0.35rem 0.65rem;font-size:0.82rem;">Undo</button>
      <div style="position:relative;">
        <button id="overflow-btn" class="btn btn-secondary" style="padding:0.35rem 0.65rem;font-size:0.82rem;">&#8943;</button>
        <div id="overflow-menu" class="overflow-menu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:180px;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
          <div style="padding:0.5rem;">
            <label style="font-size:0.72rem;color:var(--fg-muted);display:block;margin-bottom:0.2rem;">Month</label>
            <input type="month" id="month-picker" style="width:100%;padding:0.4rem;background:var(--panel-alt);border:1px solid var(--border-input);border-radius:6px;color:var(--fg1);font-size:0.82rem;">
          </div>
          <button id="change-password-btn" style="display:block;width:100%;text-align:left;padding:0.5rem 0.75rem;background:none;border:none;color:var(--fg2);font-size:0.85rem;cursor:pointer;">Change Password</button>
          <button id="logout-btn" style="display:block;width:100%;text-align:left;padding:0.5rem 0.75rem;background:none;border:none;color:var(--danger);font-size:0.85rem;cursor:pointer;">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="card">
      <h2>Monthly Summary</h2>
      <p id="summary">Loading...</p>
      <a id="paypal-pay-btn" href="#" target="_blank" rel="noopener noreferrer" class="pay-btn" style="display:none;">Pay with PayPal</a>
      <div id="breakdown"></div>
    </section>
    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
        <h2 style="margin:0;">Available Drinks</h2>
        <div class="view-toggle">
          <button id="view-grid-btn" class="btn btn-secondary" title="Grid view">&#9638;</button>
          <button id="view-list-btn" class="btn btn-secondary" title="List view">&#9776;</button>
        </div>
      </div>
      <div class="drink-grid" id="drink-grid"></div>
    </section>
    <p id="error" class="error"></p>
  </main>

  <div id="drink-confirm-modal" class="modal-backdrop hidden" hidden>
    <section class="card modal">
      <div class="modal-head">
        <h3>Confirm Drink</h3>
      </div>
      <p id="drink-confirm-text">Are you sure you want to add this drink?</p>
      <div class="modal-actions">
        <button type="button" id="confirm-drink-btn">Confirm +1</button>
        <button type="button" id="cancel-drink-btn" class="btn-secondary">Cancel</button>
      </div>
    </section>
  </div>

  <div id="password-modal" class="modal-backdrop hidden" hidden>
    <section class="card modal">
      <div class="modal-head">
        <h3>Change Password</h3>
      </div>
      <form id="password-form" class="grid compact-form">
        <input id="old-password" type="password" placeholder="Old password" required />
        <input id="new-password" type="password" placeholder="New password" required />
        <div class="modal-actions">
          <button type="submit">Update Password</button>
          <button type="button" id="cancel-password-btn" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
